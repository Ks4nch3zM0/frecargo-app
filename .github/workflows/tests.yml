name: Pruebas FRECARGO

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: frecargo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_ENGINE: mysql
      DB_NAME: frecargo_ci
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Bibliotecas de MySQL
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Dependencias
        run: python -m pip install -r requirements-mysql.txt
      - name: Migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas con MySQL, incluyendo concurrencia
        run: python manage.py test --verbosity 2
